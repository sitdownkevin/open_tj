name: Build Open TJ
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
      - name: Test
        run: make test
      - name: Build Universal app with icon
        run: make package
      - name: Verify package
        run: |
          shasum -a 256 -c dist/*.sha256
          codesign --verify --deep --strict 'build/Open TJ.app'
          for binary in 'build/Open TJ.app/Contents/MacOS/OpenTJ' 'build/Open TJ.app/Contents/Resources/motionvpn'; do
            archs="$(lipo -archs "$binary")"
            [[ " $archs " == *' arm64 '* && " $archs " == *' x86_64 '* ]]
          done
          test -s 'build/Open TJ.app/Contents/Resources/OpenTJ.icns'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTJ-macOS-Universal
          path: dist/
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenTJ-macOS-Universal
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --title "Open TJ $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
